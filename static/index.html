<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Base Dashboard</title><link rel="stylesheet" href="/static/vendor/gridstack/gridstack.min.css"><link rel="stylesheet" href="/static/dashboard.css"></head><body>
<header class="os-header"><div class="brand-mark">B</div><div><small>BASE DASHBOARD</small><h1 id="title">Base Dashboard</h1></div><div class="os-badge"><span></span> 個人工作空間</div></header>
<main><div class="view-switch" role="group" aria-label="切換畫面"><button id="desktop-tab" aria-pressed="true">應用桌面</button><button id="workspace-tab" aria-pressed="false">工作台</button></div>
<section id="desktop" aria-labelledby="desktop-heading"><div class="desktop-heading"><p class="eyebrow">YOUR APPS</p><h2 id="desktop-heading">所有組件，一觸即開。</h2><p>點選圖標開啟組件，在工作台自由安排。</p></div><div id="app-launcher" class="app-launcher"></div></section>
<nav class="app-dock" aria-label="桌面工具"><button id="menu-open" aria-haspopup="dialog" aria-label="組件管理"><span class="dock-icon">▦</span><span>組件管理</span></button><button id="import" aria-label="匯入 JSON 檔"><span class="dock-icon">⇧</span><span>匯入</span></button><input id="file" type="file" accept=".json,application/json" hidden><button id="config-export" aria-label="下載組件 JSON"><span class="dock-icon">⇩</span><span>匯出</span></button><button id="save" aria-label="保存版面"><span class="dock-icon">▣</span><span>保存</span></button><button id="load" aria-label="還原版面"><span class="dock-icon">↶</span><span>還原</span></button><button id="reset" aria-label="預設版面"><span class="dock-icon">↺</span><span>預設</span></button><button id="lock" aria-label="鎖定版面"><span class="dock-icon">◇</span><span id="lock-label">鎖定</span></button><button id="dashboard-full" aria-label="整頁全螢幕"><span class="dock-icon">⛶</span><span>全螢幕</span></button></nav>
<dialog id="component-menu" aria-labelledby="menu-title"><div class="menu-heading"><h2 id="menu-title">組件管理</h2><button id="menu-close" aria-label="關閉組件管理">關閉</button></div><p>上傳、註冊與改名，在這裡管理你的組件。</p><div class="menu-tools"><button class="primary" id="component-upload">上傳組件 JSON</button><input id="component-file" type="file" accept=".json,application/json" hidden><button id="component-example">下載組件範例</button></div><p class="muted">支援單一組件或 {"components": [...]}。ID 必須唯一；註冊保留目前版面。</p><section id="upload-preview" hidden><h3>待註冊組件</h3><ul id="upload-list"></ul><button id="component-register" class="primary">確認註冊</button></section><p id="menu-status" role="status" aria-live="polite"></p><h3>已註冊組件 <span id="component-count"></span></h3><div id="registered-components"></div></dialog>
<div id="status" role="status" aria-live="polite">正在載入 JSON 組件…</div><button id="retry-popup" hidden>點此開啟獨立視窗</button><section id="workspace" hidden><div class="workspace-heading"><h2>我的工作台</h2><div class="quick-add"><select id="catalog" aria-label="選擇組件"></select><button class="primary" id="add">＋ 加入組件</button></div></div><div class="grid-stack"></div></section><section id="single" hidden></section><footer>Base Dashboard · 你的組件，你的工作空間</footer></main>
<script src="/static/vendor/gridstack/gridstack-all.js"></script><script src="/static/dashboard.js"></script></body></html>
