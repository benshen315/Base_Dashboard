<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Base Dashboard</title><link rel="stylesheet" href="/static/vendor/gridstack/gridstack.min.css"><link rel="stylesheet" href="/static/dashboard.css"></head><body>
<header><small>BASE DASHBOARD / V0.1</small><h1 id="title">Base Dashboard</h1><p>JSON 組件 · 可調整布局 · 全螢幕 · 獨立視窗（資料為示意）</p></header>
<main><nav><button id="menu-open" aria-haspopup="dialog">☰ MENU · 組件管理</button><select id="catalog" aria-label="選擇組件"></select><button class="primary" id="add">＋ 加入組件</button><button id="import">匯入 JSON 檔</button><input id="file" type="file" accept=".json,application/json" hidden><button id="config-export">下載組件 JSON</button><button id="save">保存版面</button><button id="load">還原版面</button><button id="reset">預設版面</button><button id="lock">鎖定版面</button><button id="dashboard-full">整頁全螢幕</button></nav>
<dialog id="component-menu" aria-labelledby="menu-title"><div class="menu-heading"><h2 id="menu-title">MENU · 組件管理</h2><button id="menu-close" aria-label="關閉組件管理">關閉</button></div><p>上傳組件 JSON 並註冊到清單，再加入工作台。</p><div class="menu-tools"><button class="primary" id="component-upload">上傳組件 JSON</button><input id="component-file" type="file" accept=".json,application/json" hidden><button id="component-example">下載組件範例</button></div><p class="muted">支援單一組件或 {"components": [...]}。ID 必須唯一；註冊保留目前版面。</p><section id="upload-preview" hidden><h3>待註冊組件</h3><ul id="upload-list"></ul><button id="component-register" class="primary">確認註冊</button></section><p id="menu-status" role="status" aria-live="polite"></p><h3>已註冊組件 <span id="component-count"></span></h3><div id="registered-components"></div></dialog>
<div id="status" role="status" aria-live="polite">正在載入 JSON 組件…</div><button id="retry-popup" hidden>點此開啟獨立視窗</button><div class="grid-stack"></div><section id="single" hidden></section><footer>GridStack 10.3.1 · 組件：data/components.json · 版面：data/layout.json · 獨立視窗可手動移到另一個螢幕。</footer></main>
<script src="/static/vendor/gridstack/gridstack-all.js"></script><script src="/static/dashboard.js"></script></body></html>
