<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Base Dashboard</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css"><link rel="stylesheet" href="/static/dashboard.css"></head><body>
<header><small>BASE DASHBOARD / V0.1</small><h1 id="title">Base Dashboard</h1><p>JSON 組件 · 可調整布局 · 全螢幕 · 獨立視窗（資料為示意）</p></header>
<main><nav><select id="catalog" aria-label="選擇組件"></select><button class="primary" id="add">＋ 加入組件</button><button id="import">匯入 JSON 檔</button><input id="file" type="file" accept=".json,application/json" hidden><button id="config-export">下載組件 JSON</button><button id="save">保存版面</button><button id="load">還原版面</button><button id="reset">預設版面</button><button id="lock">鎖定版面</button><button id="dashboard-full">整頁全螢幕</button></nav>
<div id="status" role="status" aria-live="polite">正在載入 JSON 組件…</div><button id="retry-popup" hidden>點此開啟獨立視窗</button><div class="grid-stack"></div><section id="single" hidden></section><div id="drop-zone" class="popout-zone idle">↗ 將組件標題列拖到此區，開啟獨立視窗</div><footer>GridStack 10.3.1 · 組件：data/components.json · 版面：data/layout.json · 獨立視窗可手動移到另一個螢幕。</footer></main>
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script><script src="/static/dashboard.js"></script></body></html>
